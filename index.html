<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미니 게임 천국 (3-in-1 Arcade)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', '맑은 고딕', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0F172A 0%, #1E1B4B 50%, #311042 100%);
            color: #F8FAFC;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .arcade-container {
            background-color: #1E293B;
            padding: 25px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 2px solid #334155;
            text-align: center;
            position: relative;
            max-width: 520px;
            width: 100%;
        }

        h1 {
            color: #38BDF8;
            font-size: 2rem;
            margin-bottom: 15px;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        .game-tabs {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            background-color: #0F172A;
            padding: 6px;
            border-radius: 16px;
            border: 1px solid #334155;
        }

        .tab-btn {
            flex: 1;
            background-color: transparent;
            color: #94A3B8;
            border: none;
            padding: 10px 8px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: #38BDF8;
            color: #0F172A;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        .status-board {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: #0F172A;
            padding: 10px 15px;
            border-radius: 14px;
            margin-bottom: 15px;
            font-size: 0.95rem;
            font-weight: bold;
            color: #CBD5E1;
            border: 1px solid #334155;
        }

        .status-board span {
            color: #FACC15;
            font-size: 1.1rem;
        }

        .mode-select-box {
            display: none;
            gap: 8px;
            margin-bottom: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .mode-btn {
            background-color: #0F172A;
            color: #94A3B8;
            border: 1px solid #334155;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.active.angel {
            background-color: #F472B6;
            color: #FFFFFF;
            box-shadow: 0 0 10px rgba(244, 114, 182, 0.5);
        }

        .mode-btn.active.easy {
            background-color: #22C55E;
            color: #0F172A;
        }

        .mode-btn.active.hard {
            background-color: #EAB308;
            color: #0F172A;
        }

        .mode-btn.active.demon {
            background-color: #A855F7;
            color: #F8FAFC;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
        }

        .canvas-wrapper {
            position: relative;
            width: 400px;
            margin: 0 auto;
        }

        canvas#gameCanvas {
            background-color: #0F172A;
            border: 3px solid #334155;
            border-radius: 16px;
            display: block;
            touch-action: none;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }

        .tetris-panel {
            display: none;
            position: absolute;
            top: 15px;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 6px;
            text-align: center;
            backdrop-filter: blur(4px);
        }

        .tetris-panel span {
            font-size: 0.75rem;
            color: #94A3B8;
            display: block;
            margin-bottom: 4px;
        }

        #holdBox { left: 15px; }
        #nextPreviewBox { right: 15px; }

        .controls-info {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #94A3B8;
            line-height: 1.5;
            background-color: #0F172A;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .touch-controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 15px;
            max-width: 280px;
            margin-left: auto;
            margin-right: auto;
        }

        .ctrl-btn {
            background-color: #334155;
            color: #F8FAFC;
            border: 1px solid #475569;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            user-select: none;
            cursor: pointer;
            touch-action: manipulation;
        }

        .ctrl-btn:active {
            background-color: #38BDF8;
            color: #0F172A;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px;
            backdrop-filter: blur(6px);
            z-index: 10;
        }

        .overlay h2 {
            font-size: 2rem;
            color: #38BDF8;
            margin-bottom: 10px;
        }

        .overlay p {
            font-size: 1.05rem;
            color: #CBD5E1;
            margin-bottom: 20px;
            line-height: 1.6;
            word-break: keep-all;
        }

        .btn {
            background-color: #38BDF8;
            color: #0F172A;
            border: none;
            padding: 12px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        .btn:hover {
            background-color: #0EA5E9;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="arcade-container">
        <h1>🕹️ 종합 미니 게임 천국</h1>

        <div class="game-tabs">
            <button class="tab-btn active" onclick="switchGame('bounce')">⚽ 바운스볼</button>
            <button class="tab-btn" onclick="switchGame('tetris')">🧩 테트리스</button>
            <button class="tab-btn" onclick="switchGame('parking')">🚗 주차 게임</button>
        </div>

        <div class="mode-select-box" id="modeSelectBox">
            <button class="mode-btn active angel" onclick="setParkingMode('angel')">👼 천사 (7세용)</button>
            <button class="mode-btn easy" onclick="setParkingMode('easy')">🟢 쉬움</button>
            <button class="mode-btn hard" onclick="setParkingMode('hard')">🟡 하드</button>
            <button class="mode-btn demon" onclick="setParkingMode('demon')">😈 악마</button>
        </div>

        <div class="status-board" id="statusBoard"></div>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="440"></canvas>
            
            <div class="tetris-panel" id="holdBox">
                <span>HOLD (C)</span>
                <canvas id="holdCanvas" width="70" height="70"></canvas>
            </div>

            <div class="tetris-panel" id="nextPreviewBox">
                <span>NEXT</span>
                <canvas id="nextCanvas" width="70" height="70"></canvas>
            </div>
        </div>

        <div class="controls-info" id="controlsInfo"></div>

        <div class="touch-controls" id="touchControls">
            <button class="ctrl-btn" id="btnHold">HOLD</button>
            <button class="ctrl-btn" id="btnUp">▲</button>
            <div></div>
            <button class="ctrl-btn" id="btnLeft">◄</button>
            <button class="ctrl-btn" id="btnDown">▼</button>
            <button class="ctrl-btn" id="btnRight">►</button>
        </div>

        <div id="gameOverlay" class="overlay">
            <h2 id="overlayTitle">미니 게임 선택</h2>
            <p id="overlayText">게임 탭을 고르고 시작 버튼을 누르세요!</p>
            <button class="btn" id="startBtn" onclick="startGame()">게임 시작</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const nextCanvas = document.getElementById('nextCanvas');
        const nextCtx = nextCanvas.getContext('2d');
        const holdCanvas = document.getElementById('holdCanvas');
        const holdCtx = holdCanvas.getContext('2d');

        const nextPreviewBox = document.getElementById('nextPreviewBox');
        const holdBox = document.getElementById('holdBox');
        const modeSelectBox = document.getElementById('modeSelectBox');

        const statusBoard = document.getElementById('statusBoard');
        const controlsInfo = document.getElementById('controlsInfo');
        const overlay = document.getElementById('gameOverlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayText = document.getElementById('overlayText');
        const startBtn = document.getElementById('startBtn');

        let currentGame = 'bounce';
        let isGameRunning = false;
        let animationId = null;

        const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, Space: false, KeyC: false, c: false, C: false };

        window.addEventListener('keydown', e => {
            if (e.code === 'Space') keys.Space = true;
            if (e.key === 'c' || e.key === 'C') keys.KeyC = true;
            if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
            if (currentGame === 'tetris' && isGameRunning) handleTetrisInput(e.key);
        });
        window.addEventListener('keyup', e => {
            if (e.code === 'Space') keys.Space = false;
            if (e.key === 'c' || e.key === 'C') keys.KeyC = false;
            if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
        });

        function bindTouch(id, key) {
            const btn = document.getElementById(id);
            const start = (e) => {
                e.preventDefault();
                keys[key] = true;
                if (currentGame === 'tetris' && isGameRunning) handleTetrisInput(key);
            };
            const end = (e) => { e.preventDefault(); keys[key] = false; };
            btn.addEventListener('touchstart', start);
            btn.addEventListener('touchend', end);
            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', end);
            btn.addEventListener('mouseleave', end);
        }
        bindTouch('btnUp', 'ArrowUp');
        bindTouch('btnDown', 'ArrowDown');
        bindTouch('btnLeft', 'ArrowLeft');
        bindTouch('btnRight', 'ArrowRight');
        bindTouch('btnHold', 'KeyC');

        canvas.addEventListener('mousemove', e => {
            if (currentGame === 'bounce' && isGameRunning) {
                const rect = canvas.getBoundingClientRect();
                bounceState.paddle.x = e.clientX - rect.left - bounceState.paddle.width / 2;
            }
        });
        canvas.addEventListener('touchmove', e => {
            if (currentGame === 'bounce' && isGameRunning) {
                const rect = canvas.getBoundingClientRect();
                bounceState.paddle.x = e.touches[0].clientX - rect.left - bounceState.paddle.width / 2;
                e.preventDefault();
            }
        }, { passive: false });

        function switchGame(gameType) {
            currentGame = gameType;
            isGameRunning = false;
            if (animationId) cancelAnimationFrame(animationId);
            if (tetrisState.timer) clearInterval(tetrisState.timer);

            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const isTetris = (gameType === 'tetris');
            nextPreviewBox.style.display = isTetris ? 'block' : 'none';
            holdBox.style.display = isTetris ? 'block' : 'none';
            modeSelectBox.style.display = (gameType === 'parking') ? 'flex' : 'none';

            initGameUI();
            overlay.style.display = 'flex';
            
            if (gameType === 'bounce') {
                overlayTitle.innerText = "⚽ 바운스볼";
                overlayText.innerHTML = "공을 튕겨내세요!<br><b>50점마다 공의 속도가 조금씩 가속됩니다!</b>";
            } else if (gameType === 'tetris') {
                overlayTitle.innerText = "🧩 테트리스";
                overlayText.innerHTML = "Hold 기능, Ghost 미리보기 및 Hard Drop이 적용되었습니다!";
            } else if (gameType === 'parking') {
                overlayTitle.innerText = "🚗 주차 게임";
                overlayText.innerHTML = "천사 모드(7세용), 쉬움, 하드, 악마 모드를 지원합니다.";
            }
            startBtn.innerText = "게임 시작";
        }

        function initGameUI() {
            if (currentGame === 'bounce') {
                statusBoard.innerHTML = `<div>점수: <span id="score">0</span>점</div><div>최고 점수: <span id="highScore">${bounceState.highScore}</span>점</div>`;
                controlsInfo.innerHTML = `🎮 <b>방향키 (←/→)</b> 또는 마우스/터치로 받침대를 움직이세요! (50점마다 가속)`;
            } else if (currentGame === 'tetris') {
                statusBoard.innerHTML = `<div>점수: <span id="score">0</span>점</div><div>줄 제거: <span id="lines">0</span></div>`;
                controlsInfo.innerHTML = `🎮 <b>←/►</b>: 이동 | <b>▲</b>: 회전 | <b>▼</b>: 빠른 하강 | <b>Space</b>: Hard Drop | <b>C</b>: Hold`;
            } else if (currentGame === 'parking') {
                const modeMap = { angel: '👼천사', easy: '쉬움', hard: '하드', demon: '😈악마' };
                statusBoard.innerHTML = `<div>모드: <span>${modeMap[parkingMode]}</span></div><div>단계: <span id="level">1</span>/10</div><div>속도: <span id="spd">1.0x</span></div><div>시간: <span id="timer">0.0</span>s</div>`;
                controlsInfo.innerHTML = `🎮 <b>▲</b>: 전진 | <b>▼</b>: 후진 | <b>◄/►</b>: 조향<br>구역에 차량을 세우면 성공!`;
            }
        }

        function startGame() {
            overlay.style.display = 'none';
            isGameRunning = true;

            if (currentGame === 'bounce') startBounce();
            else if (currentGame === 'tetris') startTetris();
            else if (currentGame === 'parking') {
                parkingLevel = 1;
                parkingAccumulatedTime = 0;
                startParkingLevel();
            }
        }

        function gameOver(msg, scoreInfo) {
            isGameRunning = false;
            if (animationId) cancelAnimationFrame(animationId);
            if (tetrisState.timer) clearInterval(tetrisState.timer);

            overlayTitle.innerText = "💥 게임 오버!";
            overlayText.innerHTML = `${msg}<br>${scoreInfo}`;
            startBtn.innerText = "다시 도전하기";
            overlay.style.display = 'flex';
        }

        /* 1. 바운스볼 */
        const bounceState = {
            score: 0,
            highScore: 0,
            lastSpeedThreshold: 0,
            ball: { x: 200, y: 80, radius: 10, dx: 3.5, dy: 4.5 },
            paddle: { width: 85, height: 14, x: 157.5, y: 400, dx: 7 }
        };

        function startBounce() {
            bounceState.score = 0;
            bounceState.lastSpeedThreshold = 0;
            bounceState.ball.x = canvas.width / 2;
            bounceState.ball.y = 80;
            bounceState.ball.dx = (Math.random() > 0.5 ? 1 : -1) * 3.5;
            bounceState.ball.dy = 4.5;
            bounceState.paddle.x = (canvas.width - bounceState.paddle.width) / 2;
            updateBounce();
        }

        function updateBounce() {
            if (!isGameRunning || currentGame !== 'bounce') return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.beginPath();
            ctx.arc(bounceState.ball.x, bounceState.ball.y, bounceState.ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#FF477E';
            ctx.fill();

            ctx.beginPath();
            ctx.roundRect(bounceState.paddle.x, bounceState.paddle.y, bounceState.paddle.width, bounceState.paddle.height, 8);
            ctx.fillStyle = '#38BDF8';
            ctx.fill();

            const b = bounceState.ball;
            const p = bounceState.paddle;

            if (b.x + b.dx > canvas.width - b.radius || b.x + b.dx < b.radius) b.dx = -b.dx;
            if (b.y + b.dy < b.radius) b.dy = -b.dy;
            else if (b.y + b.dy > p.y - b.radius) {
                if (b.x > p.x && b.x < p.x + p.width) {
                    let hit = b.x - (p.x + p.width / 2);
                    b.dx = hit * 0.15;
                    b.dy = -Math.abs(b.dy);
                    bounceState.score += 10;
                    document.getElementById('score').innerText = bounceState.score;

                    const currentThreshold = Math.floor(bounceState.score / 50);
                    if (currentThreshold > bounceState.lastSpeedThreshold) {
                        bounceState.lastSpeedThreshold = currentThreshold;
                        b.dx *= 1.08;
                        b.dy *= 1.08;
                    }
                } else if (b.y + b.radius >= canvas.height) {
                    if (bounceState.score > bounceState.highScore) bounceState.highScore = bounceState.score;
                    gameOver("공이 바닥에 닿았습니다!", `최종 점수: <b>${bounceState.score}점</b>`);
                    return;
                }
            }

            if (keys.ArrowRight && p.x < canvas.width - p.width) p.x += p.dx;
            if (keys.ArrowLeft && p.x > 0) p.x -= p.dx;

            b.x += b.dx;
            b.y += b.dy;

            animationId = requestAnimationFrame(updateBounce);
        }

        /* 2. 테트리스 (공식 7가지 테트로미노 구성) */
        const COLS = 10, ROWS = 20, BLOCK = 22;
        
        // 테트리스 공식 7개 형태만 정의 (0번 인덱스 제외, 1~7번만 사용)
        const SHAPES = [
            [],
            [[1, 1, 1, 1]],                 // 1: I (일자 - 하늘색)
            [[1, 0, 0], [1, 1, 1]],         // 2: J (역L - 파란색)
            [[0, 0, 1], [1, 1, 1]],         // 3: L (L자 - 주황색)
            [[1, 1], [1, 1]],               // 4: O (네모 - 노란색)
            [[0, 1, 1], [1, 1, 0]],         // 5: S (번개 - 연두색)
            [[0, 1, 0], [1, 1, 1]],         // 6: T (T자 - 보라색)
            [[1, 1, 0], [0, 1, 1]]          // 7: Z (역번개 - 빨간색)
        ];
        
        const COLORS = [
            '', 
            '#00F0FF', // I
            '#0000FF', // J
            '#FF8C00', // L
            '#FFD700', // O
            '#00FF00', // S
            '#A000FF', // T
            '#FF0000'  // Z
        ];

        let tetrisBoard = [];
        const tetrisState = { score: 0, lines: 0, piece: null, nextPiece: null, holdPiece: null, canHold: true, timer: null };

        function getRandomPiece() {
            const id = Math.floor(Math.random() * 7) + 1;
            return { id: id, shape: SHAPES[id], color: COLORS[id], x: 3, y: 0 };
        }

        function startTetris() {
            tetrisBoard = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
            tetrisState.score = 0;
            tetrisState.lines = 0;
            tetrisState.holdPiece = null;
            tetrisState.canHold = true;
            tetrisState.nextPiece = getRandomPiece();
            spawnTetrisPiece();
            if (tetrisState.timer) clearInterval(tetrisState.timer);
            tetrisState.timer = setInterval(dropTetris, 600);
            renderHoldPiece();
            renderTetris();
        }

        function spawnTetrisPiece() {
            tetrisState.piece = tetrisState.nextPiece;
            tetrisState.nextPiece = getRandomPiece();
            tetrisState.canHold = true;
            renderNextPiece();
            if (checkTetrisCollide(0, 0)) {
                gameOver("블록이 가득 찼습니다!", `최종 점수: <b>${tetrisState.score}점</b>`);
            }
        }

        function holdTetrisPiece() {
            if (!tetrisState.canHold) return;

            if (!tetrisState.holdPiece) {
                tetrisState.holdPiece = { id: tetrisState.piece.id, shape: SHAPES[tetrisState.piece.id], color: COLORS[tetrisState.piece.id] };
                spawnTetrisPiece();
            } else {
                const temp = { id: tetrisState.piece.id, shape: SHAPES[tetrisState.piece.id], color: COLORS[tetrisState.piece.id] };
                tetrisState.piece = {
                    id: tetrisState.holdPiece.id,
                    shape: tetrisState.holdPiece.shape,
                    color: tetrisState.holdPiece.color,
                    x: 3, y: 0
                };
                tetrisState.holdPiece = temp;
            }
            tetrisState.canHold = false;
            renderHoldPiece();
            renderTetris();
        }

        function renderMiniCanvas(cCtx, cCanvas, piece) {
            cCtx.clearRect(0, 0, cCanvas.width, cCanvas.height);
            if (!piece) return;

            const pBlock = 14;
            const shape = piece.shape;
            const offsetX = (cCanvas.width - shape[0].length * pBlock) / 2;
            const offsetY = (cCanvas.height - shape.length * pBlock) / 2;

            cCtx.fillStyle = piece.color;
            for (let r = 0; r < shape.length; r++) {
                for (let c = 0; c < shape[r].length; c++) {
                    if (shape[r][c]) {
                        cCtx.fillRect(offsetX + c * pBlock, offsetY + r * pBlock, pBlock - 1, pBlock - 1);
                    }
                }
            }
        }

        function renderNextPiece() { renderMiniCanvas(nextCtx, nextCanvas, tetrisState.nextPiece); }
        function renderHoldPiece() { renderMiniCanvas(holdCtx, holdCanvas, tetrisState.holdPiece); }

        function checkTetrisCollide(offsetX, offsetY, shape = tetrisState.piece.shape) {
            for (let r = 0; r < shape.length; r++) {
                for (let c = 0; c < shape[r].length; c++) {
                    if (shape[r][c]) {
                        let newX = tetrisState.piece.x + c + offsetX;
                        let newY = tetrisState.piece.y + r + offsetY;
                        if (newX < 0 || newX >= COLS || newY >= ROWS) return true;
                        if (newY >= 0 && tetrisBoard[newY][newX]) return true;
                    }
                }
            }
            return false;
        }

        function handleTetrisInput(key) {
            if (!isGameRunning || currentGame !== 'tetris') return;
            if (key === 'ArrowLeft' && !checkTetrisCollide(-1, 0)) tetrisState.piece.x--;
            if (key === 'ArrowRight' && !checkTetrisCollide(1, 0)) tetrisState.piece.x++;
            if (key === 'ArrowDown') dropTetris();
            if (key === 'ArrowUp') rotateTetris();
            if (key === 'KeyC' || key === 'c' || key === 'C') holdTetrisPiece();
            if (key === 'Space' || key === ' ') {
                while (!checkTetrisCollide(0, 1)) tetrisState.piece.y++;
                dropTetris();
            }
            renderTetris();
        }

        function rotateTetris() {
            const rotated = tetrisState.piece.shape[0].map((_, i) =>
                tetrisState.piece.shape.map(row => row[i]).reverse()
            );
            if (!checkTetrisCollide(0, 0, rotated)) {
                tetrisState.piece.shape = rotated;
            }
        }

        function dropTetris() {
            if (!checkTetrisCollide(0, 1)) {
                tetrisState.piece.y++;
            } else {
                const p = tetrisState.piece;
                for (let r = 0; r < p.shape.length; r++) {
                    for (let c = 0; c < p.shape[r].length; c++) {
                        if (p.shape[r][c] && p.y + r >= 0) {
                            tetrisBoard[p.y + r][p.x + c] = p.color;
                        }
                    }
                }
                let linesCleared = 0;
                for (let r = ROWS - 1; r >= 0; r--) {
                    if (tetrisBoard[r].every(cell => cell !== 0)) {
                        tetrisBoard.splice(r, 1);
                        tetrisBoard.unshift(Array(COLS).fill(0));
                        linesCleared++;
                        r++;
                    }
                }
                if (linesCleared > 0) {
                    tetrisState.lines += linesCleared;
                    tetrisState.score += linesCleared * 100;
                    document.getElementById('score').innerText = tetrisState.score;
                    document.getElementById('lines').innerText = tetrisState.lines;
                }
                spawnTetrisPiece();
            }
            renderTetris();
        }

        function renderTetris() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const offsetX = (canvas.width - COLS * BLOCK) / 2;

            ctx.fillStyle = '#0F172A';
            ctx.fillRect(offsetX, 0, COLS * BLOCK, ROWS * BLOCK);

            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 1;
            for (let r = 0; r <= ROWS; r++) {
                ctx.beginPath();
                ctx.moveTo(offsetX, r * BLOCK);
                ctx.lineTo(offsetX + COLS * BLOCK, r * BLOCK);
                ctx.stroke();
            }
            for (let c = 0; c <= COLS; c++) {
                ctx.beginPath();
                ctx.moveTo(offsetX + c * BLOCK, 0);
                ctx.lineTo(offsetX + c * BLOCK, ROWS * BLOCK);
                ctx.stroke();
            }

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (tetrisBoard[r][c]) {
                        ctx.fillStyle = tetrisBoard[r][c];
                        ctx.fillRect(offsetX + c * BLOCK + 1, r * BLOCK + 1, BLOCK - 2, BLOCK - 2);
                    }
                }
            }

            if (tetrisState.piece) {
                let ghostY = tetrisState.piece.y;
                while (!checkTetrisCollide(0, ghostY - tetrisState.piece.y + 1)) {
                    ghostY++;
                }

                const p = tetrisState.piece;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.lineWidth = 1.5;
                for (let r = 0; r < p.shape.length; r++) {
                    for (let c = 0; c < p.shape[r].length; c++) {
                        if (p.shape[r][c]) {
                            ctx.strokeRect(offsetX + (p.x + c) * BLOCK + 2, (ghostY + r) * BLOCK + 2, BLOCK - 4, BLOCK - 4);
                        }
                    }
                }

                ctx.fillStyle = p.color;
                for (let r = 0; r < p.shape.length; r++) {
                    for (let c = 0; c < p.shape[r].length; c++) {
                        if (p.shape[r][c]) {
                            ctx.fillRect(offsetX + (p.x + c) * BLOCK + 1, (p.y + r) * BLOCK + 1, BLOCK - 2, BLOCK - 2);
                        }
                    }
                }
            }
        }

        /* 3. 주차 게임 */
        let parkingLevel = 1;
        let parkingMode = 'angel'; 
        let parkingLevelStartTime = 0;
        let parkingAccumulatedTime = 0;

        const car = {
            x: 0, y: 0,
            width: 22, height: 42,
            angle: 0, speed: 0,
            maxSpeed: 2.8, accel: 0.12, friction: 0.05, turnSpeed: 0.045
        };

        const standardLevels = [
            { start: { x: 200, y: 380, angle: -Math.PI/2 }, park: { x: 160, y: 40, w: 80, h: 70 }, walls: [], obs: [] },
            { start: { x: 80, y: 380, angle: -Math.PI/2 }, park: { x: 275, y: 175, w: 75, h: 80 }, walls: [{x:180, y:120, w:20, h:200}], obs: [{x:285, y:70, w:22, h:42, color: '#DC2626'}, {x:285, y:290, w:22, h:42, color: '#475569'}] },
            { start: { x: 60, y: 380, angle: -Math.PI/2 }, park: { x: 295, y: 45, w: 80, h: 70 }, walls: [{x:0, y:150, w:280, h:15}, {x:120, y:270, w:280, h:15}], obs: [] },
            { start: { x: 200, y: 380, angle: -Math.PI/2 }, park: { x: 40, y: 35, w: 75, h: 80 }, walls: [{x:140, y:0, w:15, h:280}], obs: [{x:48, y:160, w:22, h:42, color: '#DC2626'}] },
            { start: { x: 50, y: 380, angle: 0 }, park: { x: 305, y: 315, w: 75, h: 80 }, walls: [{x:120, y:0, w:15, h:300}, {x:240, y:100, w:15, h:340}], obs: [{x:315, y:210, w:22, h:42, color: '#475569'}] },
            { start: { x: 50, y: 50, angle: 0 }, park: { x: 305, y: 355, w: 80, h: 70 }, walls: [{x:0, y:120, w:300, h:15}], obs: [{x:180, y:240, w:22, h:42, color: '#E11D48'}, {x:220, y:240, w:22, h:42, color: '#2563EB'}] },
            { start: { x: 350, y: 380, angle: -Math.PI/2 }, park: { x: 35, y: 45, w: 75, h: 80 }, walls: [{x:100, y:100, w:200, h:15}, {x:100, y:250, w:200, h:15}], obs: [{x:48, y:200, w:22, h:42, color: '#DC2626'}] },
            { start: { x: 200, y: 220, angle: 0 }, park: { x: 305, y: 35, w: 75, h: 80 }, walls: [{x:80, y:0, w:15, h:160}, {x:280, y:160, w:15, h:280}], obs: [{x:315, y:140, w:22, h:42, color: '#475569'}, {x:150, y:320, w:22, h:42, color: '#059669'}] },
            { start: { x: 50, y: 380, angle: -Math.PI/2 }, park: { x: 165, y: 175, w: 75, h: 80 }, walls: [{x:130, y:120, w:15, h:200}, {x:250, y:120, w:15, h:200}, {x:130, y:120, w:135, h:15}], obs: [{x:172, y:280, w:22, h:42, color: '#DC2626'}] },
            { start: { x: 40, y: 380, angle: -Math.PI/2 }, park: { x: 310, y: 35, w: 75, h: 80 }, walls: [{x:100, y:0, w:15, h:320}, {x:200, y:100, w:15, h:340}, {x:300, y:0, w:15, h:320}], obs: [{x:317, y:150, w:22, h:42, color: '#9333EA'}, {x:317, y:250, w:22, h:42, color: '#EA580C'}] }
        ];

        const demonLevels = [
            { start: { x: 50, y: 390, angle: -Math.PI/2 }, park: { x: 320, y: 40, w: 60, h: 60 }, walls: [{x:120, y:0, w:20, h:350}, {x:220, y:90, w:20, h:350}], obs: [] },
            { start: { x: 200, y: 220, angle: 0 }, park: { x: 320, y: 370, w: 60, h: 60 }, walls: [{x:100, y:100, w:200, h:20}, {x:100, y:300, w:200, h:20}], obs: [{x:330, y:200, w:22, h:42, color: '#DC2626'}] },
            { start: { x: 40, y: 40, angle: 0 }, park: { x: 40, y: 370, w: 60, h: 60 }, walls: [{x:0, y:120, w:300, h:20}, {x:100, y:250, w:300, h:20}], obs: [] },
            { start: { x: 360, y: 380, angle: -Math.PI/2 }, park: { x: 30, y: 30, w: 60, h: 60 }, walls: [{x:90, y:0, w:20, h:300}, {x:180, y:140, w:20, h:300}, {x:270, y:0, w:20, h:300}], obs: [] },
            { start: { x: 200, y: 380, angle: -Math.PI/2 }, park: { x: 175, y: 180, w: 50, h: 60 }, walls: [{x:130, y:130, w:140, h:15}, {x:130, y:250, w:140, h:15}, {x:130, y:130, w:15, h:135}], obs: [{x:220, y:185, w:22, h:42, color: '#EF4444'}] },
            { start: { x: 50, y: 380, angle: 0 }, park: { x: 320, y: 40, w: 60, h: 60 }, walls: [{x:150, y:0, w:20, h:250}, {x:250, y:180, w:20, h:260}], obs: [{x:330, y:220, w:22, h:42, color: '#9333EA'}, {x:50, y:180, w:22, h:42, color: '#F59E0B'}] },
            { start: { x: 350, y: 50, angle: Math.PI }, park: { x: 40, y: 370, w: 60, h: 60 }, walls: [{x:0, y:150, w:250, h:20}, {x:150, y:280, w:250, h:20}], obs: [{x:200, y:50, w:22, h:42, color: '#DC2626'}] },
            { start: { x: 200, y: 40, angle: Math.PI/2 }, park: { x: 200, y: 370, w: 60, h: 60 }, walls: [{x:80, y:0, w:20, h:440}, {x:300, y:0, w:20, h:440}], obs: [{x:190, y:200, w:22, h:42, color: '#EF4444'}, {x:190, y:280, w:22, h:42, color: '#3B82F6'}] },
            { start: { x: 40, y: 380, angle: -Math.PI/2 }, park: { x: 330, y: 380, w: 50, h: 50 }, walls: [{x:100, y:100, w:200, h:200}], obs: [{x:340, y:200, w:22, h:42, color: '#10B981'}, {x:200, y:340, w:22, h:42, color: '#F43F5E'}] },
            { start: { x: 200, y: 220, angle: 0 }, park: { x: 340, y: 30, w: 50, h: 50 }, walls: [{x:0, y:120, w:180, h:15}, {x:220, y:120, w:180, h:15}, {x:0, y:300, w:180, h:15}, {x:220, y:300, w:180, h:15}], obs: [{x:340, y:180, w:22, h:42, color: '#A855F7'}, {x:340, y:280, w:22, h:42, color: '#EC4899'}] }
        ];

        function setParkingMode(mode) {
            parkingMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            initGameUI();
        }

        function getParkingSpeedMultiplier() {
            if (parkingMode === 'angel') return 0.7;
            if (parkingMode === 'easy') return 0.85;
            if (parkingMode === 'hard') return 1.25;
            if (parkingMode === 'demon') return 1.6;
            return 1.0;
        }

        function startParkingLevel() {
            const levels = (parkingMode === 'demon') ? demonLevels : standardLevels;
            const lvlData = levels[parkingLevel - 1];

            car.x = lvlData.start.x;
            car.y = lvlData.start.y;
            car.angle = lvlData.start.angle;
            car.speed = 0;

            const spdMult = getParkingSpeedMultiplier();
            car.maxSpeed = 2.8 * spdMult;
            car.accel = 0.12 * spdMult;

            parkingLevelStartTime = Date.now();
            document.getElementById('level').innerText = parkingLevel;
            document.getElementById('spd').innerText = spdMult.toFixed(1) + 'x';

            updateParking();
        }

        function updateParking() {
            if (!isGameRunning || currentGame !== 'parking') return;

            const levels = (parkingMode === 'demon') ? demonLevels : standardLevels;
            const lvl = levels[parkingLevel - 1];

            if (keys.ArrowUp) {
                if (car.speed < car.maxSpeed) car.speed += car.accel;
            } else if (keys.ArrowDown) {
                if (car.speed > -car.maxSpeed * 0.6) car.speed -= car.accel;
            } else {
                if (car.speed > 0) car.speed = Math.max(0, car.speed - car.friction);
                else if (car.speed < 0) car.speed = Math.min(0, car.speed + car.friction);
            }

            if (Math.abs(car.speed) > 0.05) {
                const dir = car.speed > 0 ? 1 : -1;
                if (keys.ArrowLeft) car.angle -= car.turnSpeed * dir;
                if (keys.ArrowRight) car.angle += car.turnSpeed * dir;
            }

            car.x += Math.cos(car.angle) * car.speed;
            car.y += Math.sin(car.angle) * car.speed;

            let hit = false;
            if (car.x - car.width/2 < 0 || car.x + car.width/2 > canvas.width ||
                car.y - car.height/2 < 0 || car.y + car.height/2 > canvas.height) {
                hit = true;
            }

            lvl.walls.forEach(w => {
                if (car.x + car.width/2 > w.x && car.x - car.width/2 < w.x + w.w &&
                    car.y + car.height/2 > w.y && car.y - car.height/2 < w.y + w.h) {
                    hit = true;
                }
            });

            lvl.obs.forEach(o => {
                if (car.x + car.width/2 > o.x && car.x - car.width/2 < o.x + o.w &&
                    car.y + car.height/2 > o.y && car.y - car.height/2 < o.y + o.h) {
                    hit = true;
                }
            });

            if (hit) {
                if (parkingMode === 'angel') {
                    car.speed = -car.speed * 0.5;
                    car.x += Math.cos(car.angle) * car.speed * 2;
                    car.y += Math.sin(car.angle) * car.speed * 2;
                } else {
                    gameOver("충돌했습니다!", `${parkingLevel}단계에서 사고가 났습니다.`);
                    return;
                }
            }

            const p = lvl.park;
            const inPark = (car.x > p.x && car.x < p.x + p.w && car.y > p.y && car.y < p.y + p.h);
            if (inPark && Math.abs(car.speed) < 0.2) {
                const elapsed = (Date.now() - parkingLevelStartTime) / 1000;
                parkingAccumulatedTime += elapsed;

                if (parkingLevel < 10) {
                    parkingLevel++;
                    startParkingLevel();
                    return;
                } else {
                    gameOver("🎉 모든 주차 성공!", `총 걸린 시간: <b>${parkingAccumulatedTime.toFixed(1)}초</b>`);
                    return;
                }
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = (parkingMode === 'angel' && Math.floor(Date.now() / 300) % 2 === 0) ? '#F472B6' : 'rgba(34, 197, 94, 0.25)';
            ctx.fillRect(p.x, p.y, p.w, p.h);
            ctx.strokeStyle = '#22C55E';
            ctx.lineWidth = 2;
            ctx.strokeRect(p.x, p.y, p.w, p.h);
            ctx.fillStyle = '#22C55E';
            ctx.font = '12px sans-serif';
            ctx.fillText("PARKING", p.x + 5, p.y + 15);

            ctx.fillStyle = '#475569';
            lvl.walls.forEach(w => ctx.fillRect(w.x, w.y, w.w, w.h));

            lvl.obs.forEach(o => {
                ctx.fillStyle = o.color;
                ctx.fillRect(o.x, o.y, o.w, o.h);
            });

            ctx.save();
            ctx.translate(car.x, car.y);
            ctx.rotate(car.angle + Math.PI/2);
            ctx.fillStyle = (parkingMode === 'angel') ? '#F472B6' : '#38BDF8';
            ctx.fillRect(-car.width/2, -car.height/2, car.width, car.height);
            ctx.fillStyle = '#0F172A';
            ctx.fillRect(-car.width/2 + 2, -car.height/2 + 6, car.width - 4, 8);
            ctx.restore();

            const curElapsed = parkingAccumulatedTime + (Date.now() - parkingLevelStartTime) / 1000;
            const timerEl = document.getElementById('timer');
            if (timerEl) timerEl.innerText = curElapsed.toFixed(1);

            animationId = requestAnimationFrame(updateParking);
        }

        initGameUI();
    </script>
</body>
